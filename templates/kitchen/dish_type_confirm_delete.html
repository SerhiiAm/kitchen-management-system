{% extends "base.html" %}

{% block content %}
  <h1>Are you sure you want to delete the dish type: "{{ object.name }}"?</h1>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes, delete" class="btn btn-danger">

    <a href="{% url 'kitchen:dish-type-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
