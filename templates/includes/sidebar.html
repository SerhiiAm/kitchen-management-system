      User: {{ user.username }}
    </li>
    <li class="list-group-item">
      <form action="{% url 'logout' %}" method="post" class="form-inline d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-link nav-link p-0" style="display: inline; vertical-align: baseline;">
          Logout
        </button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item">
      <a href="{% url 'login' %}">Login</a>
    </li>
  {% endif %}
  <br>
  <li class="list-group-item">
    <a href="{% url 'kitchen:index' %}">Home</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'kitchen:dish-type-list' %}">All dish type</a>
  </li>
  <li class="list-group-item">

  </li>
  <li class="list-group-item">
    <a href="#">All cooks</a>
  </li>
</ul>
