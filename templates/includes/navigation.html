<div class="container position-sticky z-index-sticky top-0">
  <div class="row">
    <div class="col-12">
      <nav class="navbar navbar-expand-lg blur blur-rounded top-0 z-index-fixed shadow position-absolute my-3 py-2 start-0 end-0 mx-4">
        <div class="container-fluid">

          <a class="navbar-brand font-weight-bolder ms-sm-3 me-4" href="{% url 'kitchen:index' %}">
            Kitchen Management System
          </a>

          <button class="navbar-toggler shadow-none ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon mt-2">
              <span class="navbar-toggler-bar bar1"></span>
              <span class="navbar-toggler-bar bar2"></span>
              <span class="navbar-toggler-bar bar3"></span>
            </span>
          </button>

          <div class="collapse navbar-collapse pt-3 pb-2 py-lg-0" id="navigation">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link text-dark font-weight-bold mx-2" href="{% url 'kitchen:cook-list' %}">
                  All cooks
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-dark font-weight-bold mx-2" href="{% url 'kitchen:dish-list' %}">
                  All Dish
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-dark font-weight-bold mx-2" href="{% url 'kitchen:dish-type-list' %}">
                  All Dish Types
                </a>
              </li>
            </ul>

            <ul class="navbar-nav ms-auto d-flex align-items-center">

              {% if user.is_authenticated %}
                <li class="nav-item me-3">
                  <span class="text-sm text-dark font-weight-bold">
                    Hello, <span class="text-primary">{{ user.username }}</span>
                  </span>
                </li>

                <li class="nav-item">
                  <form method="post" action="{% url 'logout' %}" class="d-inline m-0 p-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm mb-0 bg-gradient-danger px-3 py-2">
                      <i class="fas fa-sign-out-alt me-1"></i> Logout
                    </button>
                  </form>
                </li>

              {% endif %}

            </ul>
          </div>

        </div>
      </nav>
    </div>
  </div>
</div>
